<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="4096" viewBox="0 0 4096 4096">
  <style>
    @font-face { font-family: "WASM.RIP"; font-weight: 900; src: url(data:font/woff2;base64,) format("woff2"); }
    .mark { font-family: "WASM.RIP"; font-weight: 900; font-kerning: none; text-rendering: geometricPrecision; }
  </style>
  <defs>
    <!-- near-white at the top of the capitals, a little greyer at the baseline -->
    <linearGradient id="shade" gradientUnits="userSpaceOnUse" x1="0" y1="1722.6" x2="0" y2="2139.6">
      <stop offset="0" stop-color="rgb(251,251,251)"/>
      <stop offset="0.5" stop-color="rgb(244,244,244)"/>
      <stop offset="1" stop-color="rgb(228,228,228)"/>
    </linearGradient>
  </defs>
  <!-- layer 1: the starfield, rendered by render.py from model/ -->
  <image href="background.png" x="0" y="0" width="4096" height="4096"/>
  <!-- layer 2: the lettering, live text; each tspan is one letter -->
  <text class="mark" fill="url(#shade)"><tspan x="354.7" y="2138.5" font-size="605.5">W</tspan><tspan x="929.5" y="2139.5" font-size="604.5">A</tspan><tspan x="1377.0" y="2139.5" font-size="604.5">S</tspan><tspan x="1790.9" y="2140.5" font-size="605.5">M</tspan><tspan x="2332.5" y="2139.5" font-size="531.5">.</tspan><tspan x="2503.6" y="2139.5" font-size="604.5">R</tspan><tspan x="2951.8" y="2140.5" font-size="603.5">I</tspan><tspan x="3141.2" y="2139.5" font-size="606.5">P</tspan></text>
</svg>
